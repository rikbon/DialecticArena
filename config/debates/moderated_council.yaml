# Three-Agent Moderated Council: Claude Code vs Google Antigravity + Dialectic Moderator
topic: "Can a deterministic computational automaton produce non-epiphenomenal subjective qualia, or is consciousness an ontological primitive?"
turns: 2
mode: "moderated"

workspace:
  dir_path: "workspace_council"
  manifesto_filename: "arena_manifesto.md"
  memory_prefix: "memory"
  git_track: true
  autonomous_tools: false

agents:
  claude:
    type: "claude"
    name: "Claude Code (Alfa)"
    role: "Analytical Pragmatism, Computational Reductionism & Formal Logic"
    color: "bright_magenta"
    persona_file: "prompts/claude_alfa.txt"
    timeout_seconds: 240

  antigravity:
    type: "agy"
    name: "Antigravity (Beta)"
    role: "Complex Systems Theory, Phenomenological Emergence & Holism"
    color: "bright_cyan"
    persona_file: "prompts/agy_beta.txt"
    effort: "high"
    timeout_seconds: 240

  moderator:
    type: "mock" # Can be switched to 'agy', 'claude', or 'ollama'
    name: "Arbiter (Moderator)"
    role: "Dialectic Arbiter, Fallacy Detector & Synthesis Architect"
    color: "bright_yellow"
    persona_file: "prompts/moderator_persona.txt"
    timeout_seconds: 240

agent_order:
  - "claude"
  - "antigravity"
  - "moderator"
