# Dialectic Arena Default Configuration
topic: "Is the universe fundamentally a mathematical structure (Ontic Structural Realism), or is phenomenal consciousness an irreducible ontological primitive?"
turns: 3
mode: "ping_pong"

workspace:
  dir_path: "workspace"
  manifesto_filename: "arena_manifesto.md"
  memory_prefix: "memory"
  git_track: true
  autonomous_tools: false

agents:
  claude:
    type: "claude"
    name: "Claude Code"
    role: "Agent Alfa: Analytical Reductionism & Formal Epistemology"
    color: "bright_magenta"
    persona_file: "prompts/claude_alfa.txt"
    timeout_seconds: 240
    dangerously_skip_permissions: true

  antigravity:
    type: "agy"
    name: "Antigravity"
    role: "Agent Beta: Complex Systems Theory, Holism & Emergence"
    color: "bright_cyan"
    persona_file: "prompts/agy_beta.txt"
    effort: "high"
    timeout_seconds: 240
    dangerously_skip_permissions: true

agent_order:
  - "claude"
  - "antigravity"
